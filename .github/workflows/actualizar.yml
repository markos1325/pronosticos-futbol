name: Actualizar pronosticos

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 a.m. Colombia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Ejecutar el motor
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python Deportivas.py

      - name: Guardar resultados.json en el repositorio
        run: |
          git config user.name "bot-pronosticos"
          git config user.email "bot@users.noreply.github.com"
          git add resultados.json cache.json
          git commit -m "Actualizacion automatica" || echo "Sin cambios"
          git push
